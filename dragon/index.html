<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Brawl - Beat 'Em Up</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Press Start 2P', 'Courier New', monospace;
        }

        #gameContainer {
            position: relative;
            border: 4px solid #e94560;
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
        }

        #gameCanvas {
            display: block;
            background: #16213e;
        }

        #controls {
            position: absolute;
            bottom: -80px;
            left: 0;
            right: 0;
            color: #eee;
            font-size: 10px;
            text-align: center;
            line-height: 1.8;
        }

        #startScreen, #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-align: center;
        }

        #startScreen h1, #gameOverScreen h1 {
            font-size: 32px;
            color: #e94560;
            margin-bottom: 30px;
            text-shadow: 3px 3px 0 #533483;
        }

        #startScreen p, #gameOverScreen p {
            font-size: 12px;
            margin: 10px 0;
            color: #ccc;
        }

        .blink {
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="450"></canvas>

        <div id="startScreen">
            <h1>DRAGON BRAWL</h1>
            <p>Arrow Keys / WASD - Move (including depth)</p>
            <p>Z / J - Punch | X / K - Kick</p>
            <p>Space - Jump</p>
            <p>C / L - Use Weapon (when equipped)</p>
            <p class="blink" style="margin-top: 30px; color: #e94560;">PRESS ENTER TO START</p>
        </div>

        <div id="gameOverScreen" class="hidden">
            <h1>GAME OVER</h1>
            <p id="finalScore">Score: 0</p>
            <p class="blink" style="margin-top: 30px; color: #e94560;">PRESS ENTER TO RESTART</p>
        </div>

        <div id="controls">
            Move: Arrows/WASD | Punch: Z/J | Kick: X/K | Jump: Space | Weapon: C/L
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
